<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Estedad;font-weight:300;src:url(../../src/assets/fonts/estedad-latin-300-normal.woff2)}
@font-face{font-family:Estedad;font-weight:500;src:url(../../src/assets/fonts/estedad-latin-500-normal.woff2)}
@font-face{font-family:Estedad;font-weight:600;src:url(../../src/assets/fonts/estedad-latin-600-normal.woff2)}
html,body{margin:0;padding:0}
.card{width:1200px;height:630px;box-sizing:border-box;padding:72px 84px;background:#ffffff;color:#0d2935;font-family:Estedad,sans-serif;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,#0090cc,#3c54a1)}
.logo{height:84px;width:auto;display:block;align-self:flex-start}
h1{margin:0;font-weight:500;font-size:84px;line-height:1.04;letter-spacing:-0.02em;max-width:1040px}
p{margin:22px 0 0;font-weight:300;font-size:32px;line-height:1.3;color:#24414d;max-width:960px}
.url{font-weight:600;font-size:30px;color:#075985;letter-spacing:0.01em}
</style></head><body><div class="card">
<img class="logo" src="../../src/assets/bast-logo.svg" alt="">
<div><h1>Explainable Healthcare AI That Shows Its Work</h1>
<p>Every answer traces back to a source you can check.</p></div>
<div class="url">bast.ai</div>
</div></body></html>
